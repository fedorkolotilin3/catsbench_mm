metric_callback:
  _target_: src.metrics.BenchmarkHDMetricsCallback
  dim: ${data.dim}
  num_categories: ${data.num_categories}
  num_timesteps: ${prior.num_timesteps}
  num_cond_samples: 1000
  validation_num_cond_samples: 100
  adjusted_tv: false
  train_test_split: 0.8
  classifier_lr: 1e-2

plotter_callback:
  _target_: src.plotter.BenchmarkHDPlotterCallback
  dim: ${data.dim}
  num_categories: ${data.num_categories}
  num_samples: 1536 # number of samples to visualize
  num_trajectories: 4
  num_translations: 3
