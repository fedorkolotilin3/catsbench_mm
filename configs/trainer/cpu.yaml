_target_: lightning.pytorch.trainer.Trainer
default_root_dir: ${paths.output_dir}
accelerator: cpu
devices: 1
precision: 64-true
deterministic: true
max_epochs: 300
max_steps: 300
accumulate_grad_batches: 1
num_sanity_val_steps: 0
limit_val_batches: 0
enable_checkpointing: false
enable_model_summary: false
enable_progress_bar: false
log_every_n_steps: 1
