_target_: lightning.pytorch.trainer.Trainer

default_root_dir: ${paths.output_dir}

# The analytic MM implementation currently runs in float64 on one CPU process.
accelerator: cpu
devices: 1
precision: 64-true
deterministic: true

# One epoch contains one freshly sampled large batch, hence one MM update.
max_epochs: 100
max_steps: 100
limit_train_batches: 1.0

# Expensive benchmark metrics are evaluated once by the separate test command.
num_sanity_val_steps: 0
limit_val_batches: 0
limit_test_batches: 1.0

accumulate_grad_batches: 1
gradient_clip_val: null
log_every_n_steps: 1
enable_checkpointing: true
enable_model_summary: true
enable_progress_bar: true

