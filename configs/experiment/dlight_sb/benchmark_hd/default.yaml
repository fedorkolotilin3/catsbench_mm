# @package _global_

defaults:
  - override /data: benchmark_hd
  - override /method: dlight_sb
  - override /callbacks:
    - model_checkpoint
    - periodic_checkpoint
    - model_summary
    - progress_bar
    - compilation_warmup
    - training_monitor
    - benchmark_hd_metrics
  - override /trainer: gpu
  - _self_

callbacks:
  model_checkpoint:
    every_n_epochs: 0
    save_top_k: 0

data:
  dim: ???
  input_shape: 
    - ${data.dim}
  num_categories: 50
  batch_size: 1024
  val_batch_size: 128
  num_workers: 0
  pin_memory: false

prior:
  implementation: triton
  alpha: ???
  prior_type: ???
  eps: 0
  num_timesteps: 15
  num_skip_steps: 8

method:
  num_potentials: 16
  distr_init: samples

logger:
  csv:
    flush_logs_every_n_steps: 1

trainer:
  max_epochs: 1
  max_steps: 20000
  log_every_n_steps: 1
  limit_train_batches: 1.0
  # Match the simplex experiment cadence: 60 validations over 20000 steps.
  val_check_interval: 333
  num_sanity_val_steps: 3
  accumulate_grad_batches: 1
  gradient_clip_val: null
