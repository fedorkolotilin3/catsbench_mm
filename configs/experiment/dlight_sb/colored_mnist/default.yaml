# @package _global_

defaults:
  - override /data: colored_mnist
  - override /model: null
  - override /method: dlight_sb
  - override /callbacks:
    - model_checkpoint
    - model_summary
    - progress_bar
    - image_plotter
  - override /trainer: multi_gpu
  - _self_

prior:
  implementation: normalized
  alpha: 0.01
  eps: 1e-6
  prior_type: gaussian
  num_timesteps: 50
  num_skip_steps: 2

method:
  dim: 3072
  num_potentials: 1000
  distr_init: uniform

trainer:
  max_epochs: 10
  limit_train_batches: 1.0
  val_check_interval: 1000
  accumulate_grad_batches: 1
  gradient_clip_val: null
