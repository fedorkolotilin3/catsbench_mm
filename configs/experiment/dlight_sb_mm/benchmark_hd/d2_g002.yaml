# @package _global_

# Reuse the repository's original DLightSB BenchmarkHD base. The repository's
# d2_g002 leaf uses a relative defaults path that Hydra 1.3 resolves twice, so
# its three leaf values are repeated below without modifying that source file.
defaults:
  - /experiment/dlight_sb/benchmark_hd/default
  - override /method: dlight_sb_mm
  - override /trainer: mm_cpu
  - override /logger: tensorboard
  - _self_

data:
  dim: 2

  # SampledCoupleDataset draws a new batch from p0 and p1 on every epoch.
  # One large batch is one stochastic population-MM approximation/update.
  batch_size: 10000
  num_train_batches: 1

  # The stock callback evaluates one conditional X per test batch. With the
  # standard 10,000-point benchmark test set this yields 1,250 distinct X's.
  val_batch_size: 8

prior:
  prior_type: gaussian
  alpha: 0.02

method:
  optimizer: null
  scheduler: null
  entropy_lambda: 0
  inner_sweeps: 1
  # Consecutive epochs use fresh samples, so their empirical losses must not be
  # compared by the fixed-dataset convergence rule.
  tol: null

callbacks:
  metric_callback:
    # For every selected conditional X, generate 1,000 true and model Y values.
    # At the standard test size: 1,250 X's x 1,000 Y's per distribution.
    num_cond_samples: 1000
  model_checkpoint:
    # Keep last.ckpt for the separate Hydra test invocation without writing a
    # checkpoint after every one-step epoch.
    every_n_epochs: 100
    save_top_k: 1

trainer:
  max_epochs: 100
  max_steps: 100
