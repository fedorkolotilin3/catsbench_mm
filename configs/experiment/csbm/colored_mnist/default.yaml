# @package _global_

defaults:
  - override /data: colored_mnist
  - override /model: denoiser_image
  - override /method: csbm
  - override /callbacks:
    - model_checkpoint
    - model_summary
    - progress_bar
    - image_plotter
  - override /trainer: multi_gpu
  - _self_

prior:
  implementation: normalized
  alpha: 0.01
  eps: 1e-6
  prior_type: gaussian
  num_timesteps: ???
  num_skip_steps: ???

method:
  optimizer:
    lr: 0.0002
  ema:
    decay: 0.9999
  use_mini_batch: true
  num_first_iterations: 5
  kl_loss_coeff: 1.0
  ce_loss_coeff: 0.001
  mse_loss_coeff: 0
  ignore_index: -100
  accumulate_grad_batches: 1
  argmax_mode: true

trainer:
  max_epochs: 14
  limit_train_batches: 1.0
  val_check_interval: 1000
  accumulate_grad_batches: 1
  gradient_clip_val: null

model:
  num_channels: 64
  num_layers: 2
  ch_mults: [1, 2, 2, 2]
  attention_resolution: 16
  num_groups: 32
  num_att_heads: 4
  dropout: 0.1
