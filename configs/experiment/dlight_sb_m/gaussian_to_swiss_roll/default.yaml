# @package _global_

defaults:
  - override /data: toy
  - override /model: null
  - override /method: dlight_sb_m
  - override /callbacks:
    - model_checkpoint
    - model_summary
    - progress_bar
    - toy_metrics
  - override /trainer: gpu
  - _self_

data:
  dim: 2
  num_categories: 50
  train_test_split: [0.8, 0.2]
  batch_size: 128 
  num_workers: 0
  pin_memory: false
  input_dataset:
    _target_: src.data.toy_datamodule.DiscreteGaussianDataset
    _partial_: true
    dim: ${data.dim}
    num_categories: ${data.num_categories}
  target_dataset:
    _target_: src.data.toy_datamodule.DiscreteSwissRollDataset
    _partial_: true
    noise: 0.8
    num_categories: ${data.num_categories}

prior:
  implementation: normalized
  alpha: 0.02
  prior_type: gaussian
  num_timesteps: 15
  num_skip_steps: 8

method:
  num_potentials: 1000
  kl_loss_coeff: 1.0
  mse_loss_coeff: 0.0
  use_mini_batch: false
  distr_init: gaussian

trainer:
  max_epochs: 10
  limit_train_batches: 1.0
  val_check_interval: 1000
  accumulate_grad_batches: 1
  gradient_clip_val: null
