# @package _global_

defaults:
  - override /data: celeba
  - override /model: latent_transformer
  - override /method: alpha_csbm
  - override /callbacks:
    - model_checkpoint
    - model_summary
    - progress_bar
    - image_metrics
    - image_plotter
  - override /trainer: multi_gpu
  - _self_

prior:
  implementation: normalized
  alpha: ???
  eps: 1e-6
  prior_type: uniform
  num_timesteps: 100
  num_skip_steps: 1

method:
  optimizer:
    lr: 0.0004
  ema:
    decay: 0.999
  use_mini_batch: false
  num_first_iterations: 20
  kl_loss_coeff: 1.0
  ce_loss_coeff: 0.001
  mse_loss_coeff: 0
  ignore_index: -100
  argmax_mode: true

trainer:
  devices: 4
  max_epochs: 23
  limit_train_batches: 1.0
  val_check_interval: null
  accumulate_grad_batches: 1
  gradient_clip_val: null

callbacks:
  image_plotter:
    input_label: Male
    target_label: Female
