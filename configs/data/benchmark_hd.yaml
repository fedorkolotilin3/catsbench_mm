_target_: src.data.BenchmarkDataModule
dim: 16
input_shape: [16]
num_categories: 50
num_timesteps: ${prior.num_timesteps} # optional discretization override; must preserve the total benchmark process
num_skip_steps: ${prior.num_skip_steps} # checked against the loaded benchmark/effective discretization
batch_size: 1024 # per device; Lightning shards the dataset across devices
val_batch_size: 32 # per device
num_train_batches: 20000
num_workers: 0
pin_memory: false

benchmark:
  _target_: catsbench.BenchmarkHD.from_pretrained
  _partial_: true
  pretrained_model_name_or_path: gregkseno/catsbench 
  subfolder: hd_d${data.dim}_s${data.num_categories}_prior_${prior.prior_type}_a${prior.alpha}
  # revision: pretty_bench
